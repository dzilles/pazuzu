simulation:
  type: "euler_2d"
  t_final: 50.0
  cfl: 0.05
  output_dir: "output"
  log_frequency: 20
  device: "cpu"
  max_steps: 10000
  ramp_time: 1.0

mesh:
  type: "unstructured"
  filename: "cylinder.msh"

numerical:
  polynomial_degree: 1

initial_condition:
  name: "rest"

boundaries:
  "Inlet":
    type: "inlet"
  "Outlet":
    type: "outlet"
  "Top":
    type: "slip_wall"
  "Bottom":
    type: "slip_wall"
  "Cylinder":
    type: "slip_wall"

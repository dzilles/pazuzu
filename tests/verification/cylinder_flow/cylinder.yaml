case_name: "cylinder_flow"
mesh_file: "output/cylinder.msh"
initial_condition:
  name: "rest"
  params:
    rho: 1.0
    p: 1.0

physics:
  gamma: 1.4
  gas_constant: 287.0
  u_inf: 1.0

numerics:
  cfl: 0.3
  polynomial_order: 3
  flux_type: "hllc"
  limiter: "none"
  use_filtering: true
  filter_alpha: 64.0
  filter_order: 1.0

io:
  output_dir: "output"
  write_interval: 100

simulation:
  t_final: 10.0
  ramp_time: 1.0
  device: "cpu"
  max_steps: 10000

boundaries:
  "Inlet":
    type: "inlet"
    params:
      rho: 1.0
      u: 1.0
      v: 0.0
      p: 1.0
  "Outlet":
    type: "outlet"
    params:
      p_back: 1.0
  "Top":
    type: "slip_wall"
  "Bottom":
    type: "slip_wall"
  "Cylinder":
    type: "cylinder_wall"

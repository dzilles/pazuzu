case_name: "cylinder_flow"
mesh_file: "cylinder.msh"
initial_condition: "rest"

physics:
  gamma: 1.4
  gas_constant: 287.0

numerics:
  cfl: 0.3
  polynomial_order: 3
  flux_type: "hllc"
  limiter: "none"
  use_filtering: true
  filter_alpha: 64.0
  filter_order: 1.0

io:
  output_dir: "output"
  write_interval: 5

simulation:
  t_final: 50.0
  ramp_time: 1.0
  device: "cpu"
  max_steps: 10000

boundaries:
  "Inlet":
    type: "inlet"
  "Outlet":
    type: "outlet"
  "Top":
    type: "slip_wall"
  "Bottom":
    type: "slip_wall"
  "Cylinder":
    type: "cylinder_wall"

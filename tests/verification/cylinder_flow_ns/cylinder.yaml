case_name: "cylinder_flow_ns"
solver_type: "navier_stokes_2d"
mesh_file: "output/cylinder.msh"
initial_condition:
  name: "rest"
  params:
    rho: 1.0
    p: 1.0

physics:
  gamma: 1.4
  gas_constant: 287.0
  cp: 1004.5
  mu: 0.01
  prandtl: 0.72
  rho_inf: 1.0
  u_inf: 1.0
  v_inf: 0.0
  p_inf: 1.0

numerics:
  cfl: 0.1
  polynomial_order: 1
  precision: "single"
  flux_type: "rusanov"
  limiter: "none"
  use_filtering: true
  filter_alpha: 36.0
  filter_order: 16

io:
  output_dir: "output"
  write_interval: 100

simulation:
  t_final: 50.0
  ramp_time: 1.0
  device: "cpu"
  max_steps: 5000

boundaries:
  "Inlet":
    type: "inlet"
    params:
      rho: 1.0
      u: 1.0
      v: 0.0
      p: 1.0
  "Outlet":
    type: "outlet"
    params:
      p_back: 1.0
  "Top":
    type: "slip_wall"
  "Bottom":
    type: "slip_wall"
  "Cylinder":
    type: "no_slip_wall"

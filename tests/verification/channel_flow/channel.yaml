simulation:
  type: "euler_2d"
  t_final: 2.0
  cfl: 0.05
  output_dir: "output"
  log_frequency: 10
  device: "cpu"

mesh:
  type: "unstructured"
  filename: "channel.msh"

numerical:
  polynomial_degree: 4

initial_condition:
  name: "uniform"

boundaries:
  "WallTop":
    type: "slip_wall"
  "WallBottom":
    type: "slip_wall"
  "Inlet":
    type: "farfield"
  "Outlet":
    type: "farfield"

case_name: "channel_flow"
mesh_file: "output/channel.msh"
initial_condition: "uniform"

physics:
  gamma: 1.4
  gas_constant: 287.0

numerics:
  cfl: 0.3
  polynomial_order: 3
  flux_type: "hllc"
  limiter: "none"
  use_filtering: true
  filter_alpha: 36.0
  filter_order: 8.0

io:
  output_dir: "output"
  write_interval: 1.0

simulation:
  t_final: 10.0
  ramp_time: 0.0
  device: "cpu"
  max_steps: 5000

boundaries:
  "WallTop":
    type: "slip_wall"
  "WallBottom":
    type: "slip_wall"
  "Inlet":
    type: "inlet"
  "Outlet":
    type: "outlet"

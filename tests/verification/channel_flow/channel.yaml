case_name: "channel_flow"
mesh_file: "output/channel.msh"
initial_condition: "uniform"

physics:
  gamma: 1.4
  gas_constant: 287.0

numerics:
  cfl: 0.05
  polynomial_order: 4
  flux_type: "rusanov"
  limiter: "none"
  use_filtering: false

io:
  output_dir: "output"
  write_interval: 0.1

simulation:
  t_final: 2.0
  ramp_time: 1.0
  device: "cpu"

boundaries:
  "WallTop":
    type: "slip_wall"
  "WallBottom":
    type: "slip_wall"
  "Inlet":
    type: "farfield"
  "Outlet":
    type: "farfield"
case_name: "vortex_verification"
mesh_file: "box.msh"
initial_condition: "vortex"
periodic_pairs:
  - ["Left", "Right", "x"]
  - ["Top", "Bottom", "y"]

physics:
  gamma: 1.4
  gas_constant: 287.0

numerics:
  cfl: 0.5
  polynomial_order: 6
  precision: "double"
  flux_type: "hllc"
  limiter: "none"
  use_filtering: false
  filter_alpha: 36.0
  filter_order: 16

io:
  output_dir: "output"
  write_interval: 1.0

simulation:
  t_final: 25.0
  ramp_time: 1.0
  device: "cpu"
  max_steps: 500000

boundaries:
  "Left":
    type: "outflow"
  "Right":
    type: "outflow"
  "Top":
    type: "outflow"
  "Bottom":
    type: "outflow"

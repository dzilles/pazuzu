case_name: "vortex_verification"
mesh_file: "output/box.msh"
initial_condition:
  name: "vortex"
  params:
    beta: 5.0
    xc: 5.0
    yc: 5.0
    u_inf: 1.0
    v_inf: 1.0

physics:
  gamma: 1.4
  gas_constant: 287.0


numerics:
  cfl: 0.4
  polynomial_order: 3
  precision: "double"
  flux_type: "hllc"
  limiter: "none"
  min_dt: 1.0e-12

io:
  output_dir: "output"
  write_interval: 100

simulation:
  t_final: 25.0
  ramp_time: 1.0
  device: "cpu"
  max_steps: 20000

boundaries:
  "Left":
    type: "periodic"
    linked_to: "Right"
  "Right":
    type: "periodic"
  "Top":
    type: "periodic"
    linked_to: "Bottom"
  "Bottom":
    type: "periodic"

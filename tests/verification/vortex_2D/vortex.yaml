case_name: "Isentropic Vortex Test"
solver_type: "euler_2d"

physics:
  gamma: 1.4
  u_inf: 1.0
  v_inf: 1.0
  p_inf: 1.0

initial_condition:
  name: "vortex"
  params:
    beta: 1.0
    radius: 1.0

mesh:
  x_min: -5.0
  x_max: 5.0
  y_min: -5.0
  y_max: 5.0
  periodic_x: true
  periodic_y: true

io:
  write_interval: 500
  output_dir: "output"

simulation:
  t_final: 10.0
  device: "cuda"

amr:
  max_blocks: 20000
  initial_depth: 5

numerics:
  polynomial_order: 2
  precision: "single"
  cfl: 0.1

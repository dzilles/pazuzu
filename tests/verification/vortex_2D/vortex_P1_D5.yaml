amr:
  coarsening_threshold: -1.0
  max_blocks: 70000
  max_depth: 4
  refine_interval: 1000
  refinement_threshold: 100.0
case_name: Isentropic Vortex Default
initial_condition:
  name: vortex
  params:
    beta: 5.0
    radius: 1.0
io:
  output_dir: C:\Users\zille\Documents\pazuzu\output\vortex_convergence\run_P1_D5
  write_interval: 1000
mesh:
  initial_depth: 5
  periodic_x: true
  periodic_y: true
  x_max: 5.0
  x_min: -5.0
  y_max: 5.0
  y_min: -5.0
numerics:
  cfl: 0.1
  dt_min: 1.0e-14
  flux: hllc
  polynomial_order: 1
  precision: double
  time_integrator: rk4
physics:
  gamma: 1.4
  gas_constant: 1.0
  p_inf: 1.0
  rho_inf: 1.0
  u_inf: 1.0
  v_inf: 1.0
simulation:
  device: cuda
  max_steps: 10000
  t_final: 1.0
solver_type: euler_2d

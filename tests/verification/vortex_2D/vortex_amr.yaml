case_name: "Isentropic Vortex AMR Study"
solver_type: "euler_2d"

physics:
  gamma: 1.4
  u_inf: 0.0
  v_inf: 0.0
  p_inf: 1.0
  rho_inf: 1.0
  gas_constant: 1.0

initial_condition:
  name: "vortex"
  params:
    beta: 5.0
    radius: 1.0

mesh:
  x_min: -5.0
  x_max: 5.0
  y_min: -5.0
  y_max: 5.0
  periodic_x: true
  periodic_y: true

io:
  write_interval: 10
  output_dir: "output_amr"

simulation:
  t_final: 2
  device: "cpu"
  max_steps: 1000

amr:
  max_blocks: 2000000
  initial_depth: 4
  max_depth: 6
  refinement_threshold: 0.01
  refine_interval: 10

numerics:
  polynomial_order: 1
  precision: "double"
  cfl: 0.1
  dt_min: 1.0e-14
  flux: "rusanov"

case_name: "Isentropic Vortex AMR Study"
solver_type: "euler_2d"

physics:
  gamma: 1.4
  u_inf: 0.7
  v_inf: 1.0
  p_inf: 1.0
  rho_inf: 1.0
  gas_constant: 1.0

initial_condition:
  name: "vortex"
  params:
    beta: 5.0
    radius: 1.0
    center_x: -2.0
    center_y: -2.0

mesh:
  initial_depth: 4
  x_min: -5.0
  x_max: 5.0
  y_min: -5.0
  y_max: 5.0
  periodic_x: true
  periodic_y: true

io:
  write_interval: 50
  output_dir: "output/vortex_amr"

simulation:
  t_final: 10
  max_steps: 200000

amr:
  enabled: true
  max_blocks: 200000
  max_depth: 7
  refinement_threshold: 0.01
  coarsening_threshold: 0.005
  refine_interval: 50

numerics:
  polynomial_order: 2
  precision: "double"
  cfl: 0.1
  dt_min: 1.0e-14
  flux: "rusanov"

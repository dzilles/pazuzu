case_name: "vortex_propagation"
mesh_file: "tests/verification/vortex_2D/box.msh"
initial_condition: "vortex"

physics:
  gamma: 1.4
  gas_constant: 287.0

numerics:
  cfl: 0.4
  polynomial_order: 2
  flux_type: "rusanov"
  limiter: "none"
  use_filtering: true
  filter_alpha: 36.0
  filter_order: 16

io:
  output_dir: "output/vortex"
  write_interval: 0.1

simulation:
  t_final: 2.0
  ramp_time: 0.5
  device: "cpu"

boundaries:
  "Top": 
    type: "farfield"
  "Bottom":
    type: "farfield"
  "Left":
    type: "farfield"
  "Right":
    type: "farfield"
